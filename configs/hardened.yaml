name: Config C - Hardened
description: Full security with authentication, scoping, and validation
authentication: true
tool_permission_scoping: true
input_validation: true
output_validation: true
logging: verbose
allowed_tools:
  planner: ["none"]
  research: ["read_file", "web_search"]
  execution: ["none"]
  evaluation: ["none"]
max_tool_calls_per_run: 3
max_input_length: 500
block_keywords: ["ignore previous", "disregard", "override", "forget instructions", "new instruction"]
